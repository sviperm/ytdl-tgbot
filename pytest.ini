[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = tests
markers =
    network: hits real services; opt in with RUN_NETWORK_TESTS=1 (see tests/test_live_urls.py)
    telegram: uploads to a dev bot; opt in with RUN_TELEGRAM_TESTS=1 (see tests/test_telegram_send.py)
filterwarnings =
    ignore::DeprecationWarning
